name = "adder4"
family = "adder"
split = "dev"
top = "adder4"
description = """
A 4-bit binary adder with carry-in and carry-out.
sum and cout together form the 5-bit result of a + b + cin, that is {cout, sum} = a + b + cin.
The circuit is purely combinational: no clock, no registers, no latches.
"""

[[ports]]
name = "a"
direction = "input"
width = 4

[[ports]]
name = "b"
direction = "input"
width = 4

[[ports]]
name = "cin"
direction = "input"
width = 1

[[ports]]
name = "sum"
direction = "output"
width = 4

[[ports]]
name = "cout"
direction = "output"
width = 1
