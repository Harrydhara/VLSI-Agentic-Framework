# Default settings for the VLSI design agent.
# To experiment, copy this file and pass the copy with --config instead of editing it.

[llm]
base_url = "http://localhost:11434"  # Ollama server running inside WSL
model = "gemma4:26b"
request_timeout_s = 300

[tools]
# Absolute paths on purpose: this machine has three yosys installs (0.33, 0.52, 0.57),
# and synthesis cell counts can change between versions.
iverilog = "/usr/bin/iverilog"
vvp = "/usr/bin/vvp"
yosys = "/usr/local/bin/yosys"
