[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlsi-agent"
version = "0.1.0"
description = "Agentic VLSI design toolkit: LLM-generated Verilog checked with Icarus Verilog and Yosys"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vlsi-agent = "vlsi_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the real EDA tools and a running Ollama server (run inside WSL)",
]
